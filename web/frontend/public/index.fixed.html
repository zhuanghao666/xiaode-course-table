    *{box-sizing:border-box} html,body{margin:0;padding:0}
    body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 15%, rgba(183,194,206,.42), transparent 24%),radial-gradient(circle at 88% 8%, rgba(182,173,196,.34), transparent 26%),radial-gradient(circle at 82% 86%, rgba(203,188,177,.34), transparent 24%),linear-gradient(135deg,var(--bg1),var(--bg2) 58%,var(--bg3));min-height:100vh}
    .wrap{max-width:1480px;margin:0 auto;padding:18px;position:relative}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.62);border-radius:30px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
    .hidden{display:none!important}
    .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;padding:24px 28px;align-items:center;margin-bottom:16px}
    .title{font-size:clamp(34px,5vw,56px);font-weight:900;letter-spacing:-.05em;line-height:1.05}
    .sub,.muted{color:var(--muted);font-weight:700;line-height:1.7}.sub{margin-top:10px}
    .right{text-align:right}.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:linear-gradient(135deg,#d6c2ad,#ccb09a);color:#61534d;font-size:14px;font-weight:900}.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:#8d6650}
    .next-title{font-size:30px;font-weight:900;margin-top:16px;line-height:1.18}.next-meta{margin-top:8px;color:#66707c;font-size:18px;font-weight:700}
    .auth{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px}.panel{background:rgba(255,255,255,.56);border:1px solid rgba(255,255,255,.6);border-radius:24px;padding:18px}.panel h3{margin:0 0 8px;font-size:22px}.panel p{margin:0 0 14px;color:var(--muted);line-height:1.7}
    .row{display:grid;gap:6px;margin-bottom:10px}.row label{font-size:13px;font-weight:800;color:#5f6975}
    input,select,textarea{width:100%;padding:11px 12px;border-radius:14px;border:1px solid rgba(183,190,198,.7);background:rgba(255,255,255,.9);font:inherit;color:var(--text)} textarea{min-height:120px;resize:vertical}
    .btn{border:0;cursor:pointer;font:inherit;transition:.2s ease;border-radius:999px;padding:10px 14px;font-weight:800}.btn:hover{transform:translateY(-1px)} .primary{background:linear-gradient(135deg,var(--accent),#7f76a4);color:#fff}.ghost{background:rgba(255,255,255,.78);color:var(--text)} .danger{background:linear-gradient(135deg,#c47a7a,#ab6262);color:#fff}
    .bar{display:grid;grid-template-columns:64px 1fr auto auto auto 64px;gap:12px;align-items:center;padding:16px 20px;margin-bottom:16px}.nav{width:50px;height:50px;padding:0;border-radius:50%;font-size:22px}
    .badge{display:inline-flex;padding:8px 13px;border-radius:999px;color:#fff;font-size:13px;font-weight:800;background:linear-gradient(135deg,#9fb1bf,#899cad);margin-left:10px}.badge.current{background:linear-gradient(135deg,#cdb296,#c0997d)}
    .week-strip{display:flex;gap:9px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.week-strip::-webkit-scrollbar{display:none}.chip{min-width:42px;height:42px;display:grid;place-items:center;border-radius:999px;color:#65707b;font-weight:900;background:rgba(255,255,255,.48);cursor:pointer;border:1px solid rgba(181,188,196,.28)}.chip.active{color:#fff;background:linear-gradient(135deg,var(--accent),#7f76a4)}
    .mode{display:inline-flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.64)}.mode .btn{padding:8px 12px;background:transparent;color:#66707a}.mode .btn.active{color:#fff;background:linear-gradient(135deg,var(--accent),#7f76a4)}
    .section{padding:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;color:#6f7883;font-size:14px;font-weight:700}.legend,.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:middle}
    .table{display:grid;grid-template-columns:170px repeat(7,minmax(140px,1fr));border-radius:24px;overflow:hidden;background:rgba(255,255,255,.54);border:1px solid rgba(255,255,255,.5)}
    .head{min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:900;background:linear-gradient(135deg,#978fad,#aab8c4);border-right:1px solid rgba(255,255,255,.12)} .head.today{background:linear-gradient(135deg,#c7b2b6,#ac9db6)}
    .timecell,.slot{min-height:138px;border-top:1px solid rgba(216,222,229,.8);border-right:1px solid rgba(216,222,229,.8)} .timecell{padding:18px 16px;background:rgba(255,255,255,.8)} .slot{padding:10px;background:rgba(255,255,255,.86)} .slot.today{background:linear-gradient(180deg,rgba(232,224,229,.35),rgba(255,255,255,.92))}
    .course{height:100%;border-radius:18px;padding:14px;color:#fff;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;cursor:pointer;box-shadow:0 10px 24px rgba(103,111,124,.12)} .course.current{box-shadow:0 0 0 4px rgba(255,255,255,.86),0 14px 24px rgba(103,111,124,.16)} .course.soon{box-shadow:0 0 0 4px rgba(210,181,145,.65),0 14px 24px rgba(170,138,104,.15)}
    .slot.merged{display:flex;align-items:stretch}.slot.stacked{display:grid;gap:5px;align-content:stretch}.slot.stacked .course{height:auto;min-height:0;border-radius:12px;padding:7px 4px}.slot.stacked .name{font-size:12px;line-height:1.18;margin-bottom:3px}.slot.stacked .meta2{font-size:10px;line-height:1.25}.merge-count{position:absolute;left:7px;top:7px;border-radius:999px;padding:2px 6px;background:rgba(255,255,255,.24);font-size:10px;font-weight:950}.merge-span{margin-top:5px;font-size:10px;font-weight:900;opacity:.86}
    .mark{position:absolute;top:8px;right:8px;border-radius:999px;padding:4px 8px;background:rgba(255,255,255,.22);font-size:11px;font-weight:900}.name{font-size:16px;font-weight:900;line-height:1.3;margin-bottom:8px}.meta2{font-size:13px;line-height:1.55;font-weight:700}.empty{height:100%;border-radius:16px;background:rgba(255,255,255,.38)} .empty-slot{height:100%;border-radius:16px;background:rgba(255,255,255,.24);border:0;pointer-events:none}
    .mobile{display:none;gap:12px;margin-top:16px}.mday{padding:16px}.mday-title{font-size:17px;font-weight:900;margin-bottom:8px}
    .drawer{margin-top:16px;padding:18px}.drawer-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.inline{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .mini-table{width:100%;border-collapse:collapse;font-size:13px}.mini-table th,.mini-table td{border-bottom:1px solid rgba(209,215,224,.8);padding:8px 6px;text-align:left}
    .modal,.backdrop{position:fixed;inset:0;z-index:50}.backdrop{background:rgba(31,37,46,.28)}.modal{display:grid;place-items:center;padding:18px}.modal-card{width:min(920px,96vw);max-height:90vh;overflow:auto;background:rgba(255,255,255,.96);border-radius:28px;padding:22px;box-shadow:0 24px 60px rgba(61,70,85,.2)}.modal-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.modal-title{font-size:24px;font-weight:900}.detail{background:rgba(243,245,248,.9);border-radius:18px;padding:14px;line-height:1.8;font-size:15px}.tag{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),#7f76a4)}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:rgba(73,81,93,.92);color:#fff;padding:12px 16px;border-radius:16px;box-shadow:0 14px 28px rgba(55,65,81,.18);font-size:14px;line-height:1.55;font-weight:700;opacity:0;pointer-events:none;transition:.22s ease;max-width:min(92vw,520px);text-align:center;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .auth{display:block;padding:18px}.auth-card{max-width:560px;margin:0 auto;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.68);border-radius:28px;padding:20px}.auth-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}.auth-head h3{font-size:26px;margin:0}.auth-switch{border:0;background:transparent;color:var(--accent);font-weight:900;font-size:14px;padding:8px;cursor:pointer}.auth-card .inline{align-items:center}.auth-note{font-size:13px;color:var(--muted);font-weight:800;margin-top:12px}.auth-secondary{display:block;margin-top:12px;color:var(--accent);font-weight:900;text-decoration:none;cursor:pointer}
    .feature-hub{margin-top:16px;padding:18px}.feature-title{font-size:22px;font-weight:900;margin-bottom:12px}.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.feature-card{background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.6);border-radius:24px;padding:16px}.feature-card h3{margin:0 0 10px;font-size:18px}.feature-actions{display:flex;gap:10px;flex-wrap:wrap}.feature-actions .btn{padding:9px 13px}.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.theme-btn{border:1px solid rgba(160,170,182,.35);background:rgba(255,255,255,.78);border-radius:18px;padding:10px;cursor:pointer;text-align:left;font-weight:900;color:var(--text)}.theme-btn.active{outline:3px solid rgba(143,132,168,.35);background:rgba(255,255,255,.95)}.theme-swatch{display:flex;gap:5px;margin-top:7px}.theme-swatch i{display:block;width:22px;height:14px;border-radius:999px}
    .quick-manage-anchor{scroll-margin-top:18px}

    .main-actions-minor{display:none!important}
    .bar>div:nth-child(2){display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:nowrap}.bar .badge{margin-left:0;white-space:nowrap}.bar .mode{justify-self:center}.feature-card p{margin:0 0 12px;color:var(--muted);font-weight:700;line-height:1.55}.feature-grid-v16{grid-template-columns:repeat(2,minmax(0,1fr))}.feature-card-primary{background:linear-gradient(135deg,rgba(255,255,255,.74),rgba(255,255,255,.5))}.icon-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.feature-tile{border:1px solid rgba(160,170,182,.32);border-radius:20px;background:rgba(255,255,255,.78);padding:12px 8px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text);font:inherit;font-weight:900;cursor:pointer}.feature-tile span{font-size:22px;line-height:1}.feature-tile b{font-size:13px}.primary-tile{background:linear-gradient(135deg,var(--accent),#7f76a4);color:#fff}.theme-card{grid-column:1/-1}#drawer .panel>h3{display:inline-flex;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.74);box-shadow:0 8px 18px rgba(80,90,108,.08)}#drawer .panel>p{padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.45)}#termLine:empty{display:none}.toolbar:has(#termLine:empty) .legend{margin-left:auto}

    /* v17: App 化收敛：隐藏冗余头图、当前功能面板、账号入口、全局主题联动 */
    #heroSection{display:none!important}
    #mainSection>.sub{display:none!important}
    #termLine{display:none!important}
    .account-avatar{position:absolute;right:16px;top:12px;z-index:12;width:34px;height:34px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7f76a4);color:#fff;font-size:17px;font-weight:900;box-shadow:0 8px 18px rgba(70,80,96,.14);cursor:pointer;display:grid;place-items:center;opacity:.92} .account-avatar:hover{transform:translateY(-1px);opacity:1}

    const state={token:localStorage.getItem('courseTableUserToken')||'',switchKey:localStorage.getItem('xiaodeCurrentSwitchKey')||'',accountId:currentStoredAccountId(),user:null,meta:null,slots:[],courses:[],previewWeek:null,infoMode:'compact',editingCourse:null,noticeQuote:pickHealingQuote(),theme:loadAccountLocal('xiaodeTheme','morandi'),bottomToolbarHidden:loadAccountLocal('xiaodeBottomToolbarHidden','0')==='1',tableSize:loadAccountLocal('xiaodeTableSize','classic'),tableDayWidth:Number(loadAccountLocal('xiaodeTableDayWidth','0')),tableRowHeight:Number(loadAccountLocal('xiaodeTableRowHeight','0')),hideFifthSlot:loadAccountLocal('xiaodeHideFifthSlot','0')==='1',courseSettings:loadCourseSettings(),drawerPlaceholder:null,drawerOriginalParent:null,preferencesReady:false,applyingPreferences:false,accountRequestVersion:0,accountTransitionVersion:0};

    async function api(path, opts={}, authToken=state.token){const res=await fetch(path,{headers:{'Content-Type':'application/json',...(authToken?{'x-user-token':authToken}:{})},...opts}); const text=await res.text(); let data={}; try{data=text?JSON.parse(text):{}}catch{data={message:text}} if(!res.ok) throw new Error(data.message||'请求失败'); return data;}

    const preferenceSaveTimers=new Map();
    function schedulePreferenceSave(){
      if(!state.user||!state.token||state.applyingPreferences) return;
      const prefs=currentPreferenceSnapshot();
      const accountId=state.accountId;
      const token=state.token;
      saveAccountPreferencesLocal(prefs);

      const idx=list.findIndex(x=>(x.accountId&&x.accountId===accountId)||(!x.accountId&&x.username===state.user.username));
      if(idx>=0){ list[idx]={...list[idx], preferences:prefs, name:state.user.name, username:state.user.username, savedAt:new Date().toISOString()}; setSavedAccounts(list); }
      clearTimeout(preferenceSaveTimers.get(accountId));
      const timer=setTimeout(async()=>{
        if(!accountId||!token) return;
        try{ await api('/api/my/preferences',{method:'PUT',body:JSON.stringify({preferences:prefs})},token); }
        catch(e){ console.warn('preferences save failed', e); }

      },500);
      preferenceSaveTimers.set(accountId,timer);
    }
    function applyAccountPreferences(pref={}){

    }

    function pad(n){return String(n).padStart(2,'0')}
    function effectiveMeta(){ const meta=state.meta||{}; const settings=state.courseSettings||{}; return {...meta,totalWeeks:Number(settings.totalWeeks||meta.totalWeeks||17),termStart:settings.termStart||meta.termStart||'',weekStartDay:Number(settings.weekStartDay||1)}; }
    function totalWeeks(){ return Number(effectiveMeta().totalWeeks||17); }
    function saveCourseSettings(next){ state.courseSettings={...DEFAULT_COURSE_SETTINGS,...(state.courseSettings||{}),...(next||{})}; localStorage.setItem(accountStorageKey('xiaodeCourseSettings',state.accountId), JSON.stringify(state.courseSettings)); applyCourseSettingsVisibility(); schedulePreferenceSave(); }
    function applyCourseSettingsVisibility(){ const st=state.courseSettings||DEFAULT_COURSE_SETTINGS; document.body.classList.toggle('hide-location-module', !st.showLocation); document.body.classList.toggle('hide-teacher-module', !st.showTeacher); document.body.classList.toggle('hide-class-group-module', !st.showClassGroup); document.body.classList.toggle('custom-time-module', !!st.customTime); }
    const DEFAULT_12_SLOTS=[
      {slot:1,label:'第1节',start:'08:00',end:'08:45',range:'08:00-08:45'},
      {slot:2,label:'第2节',start:'08:55',end:'09:40',range:'08:55-09:40'},
      {slot:3,label:'第3节',start:'10:00',end:'10:45',range:'10:00-10:45'},

      {slot:9,label:'第9节',start:'16:45',end:'17:30',range:'16:45-17:30'},
      {slot:10,label:'第10节',start:'18:20',end:'19:05',range:'18:20-19:05'},
      {slot:11,label:'第11节',start:'19:10',end:'19:55',range:'19:10-19:55'},
      {slot:12,label:'第12节',start:'20:05',end:'20:50',range:'20:05-20:50'}
    ];
    function normalizeClientSlots(slots=[]){
      const by=new Map((Array.isArray(slots)?slots:[]).map(s=>[Number(s.slot),s]));
      return DEFAULT_12_SLOTS.map(d=>{
        const old=by.get(Number(d.slot))||{};
        const start=String(old.start||String(old.range||'').split('-')[0]||d.start);
        const end=String(old.end||String(old.range||'').split('-')[1]||d.end);
        return {slot:Number(d.slot),label:String(old.label||d.label),start,end,range:(start&&end)?`${start}-${end}`:d.range};
      });
    }
    function visibleSlots(){ return normalizeClientSlots(state.slots).filter(s=>!(state.hideFifthSlot && Number(s.slot)===5)); }
    function weekDateObject(day, week=getSelectedWeek()){
      const meta=effectiveMeta();
      const start=new Date(`${meta.termStart||''}T00:00:00`);
      if(Number.isNaN(start.getTime())) return null;
      const weekStart=Number(meta.weekStartDay||1);
      const offset=(Number(day)-weekStart+7)%7;
      const d=new Date(start);
      d.setDate(start.getDate()+(Number(week)-1)*7+offset);
      return d;
    }
    function selectedWeekDate(day){
      const d=weekDateObject(day);
      if(!d) return '';
      return `${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }
    function setHideFifthSlot(hidden){
      state.hideFifthSlot=!!hidden;
      saveAccountLocal('xiaodeHideFifthSlot', state.hideFifthSlot?'1':'0');
      renderAll();
      schedulePreferenceSave();
      toast(state.hideFifthSlot?'已隐藏第5节':'已显示第5节');
    }
    function timeToMin(t){const [h,m]=String(t||'00:00').split(':').map(Number); return h*60+m}
    function getWeek(now=new Date()){const meta=effectiveMeta(); const start=new Date(`${meta.termStart||'2025-02-17'}T00:00:00`); const diff=Math.floor((now-start)/86400000); return Math.max(1,Math.min(Number(meta.totalWeeks||17),Math.floor(diff/7)+1));}
    function getSelectedWeek(){return state.previewWeek||getWeek()}
    function getDayIndex(now=new Date()){const d=now.getDay(); return d===0?7:d}
    function getSlot(num){return state.slots.find(s=>Number(s.slot)===Number(num))||{label:'',range:'',start:'00:00',end:'00:00'}}
    function activeInWeek(c,w){if(!c.weeks.includes(w)) return false; if(c.oddEven==='odd'&&w%2===0) return false; if(c.oddEven==='even'&&w%2===1) return false; return true}
    function coursesForWeek(w){return state.courses.filter(c=>activeInWeek(c,w)).sort((a,b)=>(a.day-b.day)||(a.slot-b.slot))}
    function nowCourse(now=new Date()){const w=getWeek(now),d=getDayIndex(now),m=now.getHours()*60+now.getMinutes(); return coursesForWeek(w).find(c=>c.day===d&&m>=timeToMin(getSlot(c.slot).start)&&m<=timeToMin(getSlot(c.slot).end))||null}
    function nextCourse(now=new Date()){const w=getWeek(now),d=getDayIndex(now),m=now.getHours()*60+now.getMinutes(); return coursesForWeek(w).find(c=>c.day>d||(c.day===d&&timeToMin(getSlot(c.slot).start)>m))||null}
    function soonCourse(now=new Date()){const w=getWeek(now),d=getDayIndex(now),m=now.getHours()*60+now.getMinutes(); return coursesForWeek(w).find(c=>c.day===d&&timeToMin(getSlot(c.slot).start)>m&&timeToMin(getSlot(c.slot).start)-m<=10)||null}
    function courseMergeKey(c){ return [c.name||'',c.shortName||'',c.teacher||'',c.location||'',c.classGroup||'',c.category||'',c.oddEven||'all'].map(v=>String(v).trim().toLowerCase()).join('|'); }
    function groupSameCourses(list){
      const map=new Map();
      (list||[]).forEach(c=>{ const key=courseMergeKey(c); if(!map.has(key)) map.set(key,{key,course:c,count:0,ids:[]}); const g=map.get(key); g.count+=1; g.ids.push(c.id); });

    }
    function coursesForCell(day,slot,week){ return state.courses.filter(c=>Number(c.day)===Number(day)&&Number(c.slot)===Number(slot)&&activeInWeek(c,week)); }
    function groupsForCell(day,slot,week){ return groupSameCourses(coursesForCell(day,slot,week)); }
    function canSpanNext(group,day,slot,week){ const groups=groupsForCell(day,slot,week); return groups.length===1 && groups[0].key===group.key; }
    function groupStatusClass(group,current,soon,week,actualWeek){ if(week!==actualWeek) return ''; const ids=group?.ids||[]; if(current&&ids.includes(current.id)) return 'current'; if(soon&&ids.includes(soon.id)) return 'soon'; return ''; }
    function buildCourse(c,cls='',opts={}){ const settings=state.courseSettings||DEFAULT_COURSE_SETTINGS; const display=escapeHtml(c.shortName||c.name||''); const teacher=escapeHtml(c.teacher||''); const location=escapeHtml(c.location||''); const classGroup=escapeHtml(c.classGroup||''); const metaParts=[]; if(settings.showTeacher && state.infoMode==='full' && teacher) metaParts.push(teacher); if(settings.showLocation && location) metaParts.push(location); if(settings.showClassGroup && classGroup) metaParts.push(classGroup); const meta=metaParts.join('<br>'); const count=Number(opts.count||0); const span=Number(opts.span||1); const countBadge=count>1?`<div class="merge-count">×${count}</div>`:''; const spanBadge=span>1?`<div class="merge-span">${opts.startSlot||c.slot}-${opts.endSlot||c.slot}节</div>`:''; return `<div class="course ${cls}" data-id="${c.id}" title="${escapeHtml(c.name||'')}" style="background:${STYLE[c.category]||STYLE.custom}">${cls?`<div class="mark">${cls==='current'?'进行中':'即将上课'}</div>`:''}${countBadge}<div class="name">${display}</div><div class="meta2">${meta}</div>${spanBadge}</div>`}

    function normalizeTableSize(size){return ['classic','screenshot','classroom'].includes(size)?size:'classic';}
    function defaultTableDayWidth(size){
      const mode=normalizeTableSize(size);
      if(mode==='screenshot') return 42;
      if(mode==='classroom') return 52;
      return 48;
    }
    function defaultTableRowHeight(size){
      const mode=normalizeTableSize(size);
      if(mode==='screenshot') return 72;
      if(mode==='classroom') return 78;
      return 118;

    function normalizeTableDayWidth(value,size=state.tableSize){
      const n=Number(value);
      if(!Number.isFinite(n) || n<=0) return defaultTableDayWidth(size);
      return Math.max(38, Math.min(96, Math.round(n)));
    }
    function normalizeTableRowHeight(value,size=state.tableSize){
      const n=Number(value);
      if(!Number.isFinite(n) || n<=0) return defaultTableRowHeight(size);
      return Math.max(58, Math.min(160, Math.round(n)));
    }
    function tableSizeLabel(size){
      const mode=normalizeTableSize(size);
      return mode==='screenshot'?'一屏截图':(mode==='classroom'?'教室优先':'经典卡片');

    function applyTableSize(size, opts={}){

      const storedHeight=loadAccountLocal('xiaodeTableRowHeight','');

    function renderTable(){
      const now=new Date(), actualWeek=getWeek(now), week=getSelectedWeek(), today=getDayIndex(now);
      const current=nowCourse(now), soon=soonCourse(now), slots=visibleSlots();
      const occupied=new Set();

        const isToday=week===actualWeek&&i+1===today;

      });
      for(let day=1; day<=7; day++){
        for(let slotIdx=0; slotIdx<slots.length; slotIdx++){
          const slot=slots[slotIdx];
          const row=slotIdx+2;
          const occKey=`${day}-${slot.slot}`;
          if(occupied.has(occKey)) continue;
          const todayCls=(week===actualWeek&&day===today)?'today':'';
          const groups=groupsForCell(day,slot.slot,week);
          if(!groups.length){
            html+=`<div class="slot ${todayCls} empty-clickable" data-day="${day}" data-slot="${slot.slot}" style="grid-column:${day+1};grid-row:${row}"><div class="empty-slot"></div></div>`;
            continue;
          }
          if(groups.length>1){

            html+=`<div class="slot ${todayCls} stacked" style="grid-column:${day+1};grid-row:${row}">${stack}</div>`;
            continue;
          }
          const g=groups[0];
          let span=1;
          while(slotIdx+span<slots.length && canSpanNext(g,day,slots[slotIdx+span].slot,week)){
            occupied.add(`${day}-${slots[slotIdx+span].slot}`);
            span++;
          }
          const cls=groupStatusClass(g,current,soon,week,actualWeek);
          html+=`<div class="slot ${todayCls} merged" style="grid-column:${day+1};grid-row:${row} / span ${span}">${buildCourse(g.course,cls,{count:g.count,span,startSlot:slot.slot,endSlot:slots[slotIdx+span-1].slot})}</div>`;
        }

    function mergedDayItems(day,week){
      const slots=visibleSlots();
      const items=[];
      for(let slotIdx=0; slotIdx<slots.length; slotIdx++){
        const slot=slots[slotIdx];
        const groups=groupsForCell(day,slot.slot,week);
        if(!groups.length) continue;
        if(groups.length>1){ groups.forEach(g=>items.push({...g,span:1,startSlot:slot.slot,endSlot:slot.slot})); continue; }
        const g={...groups[0],span:1,startSlot:slot.slot,endSlot:slot.slot};
        while(slotIdx+g.span<slots.length && canSpanNext(g,day,slots[slotIdx+g.span].slot,week)){
          g.endSlot=slots[slotIdx+g.span].slot;
          g.span++;
        }
        slotIdx+=g.span-1;
        items.push(g);
      }
      return items;
    }

        function collectSlotTimes(){
      const rows=$$('#slotsTable tr[data-slot]');
      const slots=rows.map((row,idx)=>{
        const slot=Number(row.dataset.slot||idx+1);
        const label=row.querySelector('[data-field="label"]')?.value.trim() || `第${slot}节`;
        const start=row.querySelector('[data-field="start"]')?.value.trim() || '';
        const end=row.querySelector('[data-field="end"]')?.value.trim() || '';
        return {slot,label,start,end,range:(start&&end)?`${start}-${end}`:''};
      });
      if(!slots.length) throw new Error('没有可保存的节次');
      for(const s of slots){
        if(!/^\d{2}:\d{2}$/.test(s.start)||!/^\d{2}:\d{2}$/.test(s.end)) throw new Error(`${s.label} 的开始/结束时间不完整`);
        if(timeToMin(s.start)>=timeToMin(s.end)) throw new Error(`${s.label} 的结束时间要晚于开始时间`);
      }
      return slots;
    }

    function explainJwxtError(message){
      const msg=String(message||'教务系统导入失败');
      let reason='暂时无法确定具体原因。';
      let actions=['确认教务系统账号密码正确。','确认当前网络能打开教务系统。','稍后重试，避开教务系统拥堵时段。'];
      if(/账号|密码|用户名|login|登录失败|invalid|incorrect/i.test(msg)){
        reason='更像是教务系统账号或密码不正确，或者登录后页面没有进入系统首页。';
        actions=['重新输入教务账号和密码。','先在浏览器里手动登录教务系统，确认密码没有过期。','如果学校要求修改初始密码，请先在教务系统里处理。'];
      }else if(/验证码|captcha|verify|验证/i.test(msg)){
        reason='教务系统可能要求验证码或额外验证，当前自动导入无法完成。';
        actions=['先在浏览器手动登录一次教务系统。','稍后重试。','把截图或报错通过“反馈建议”发给管理员，后续可以加验证码方案。'];
      }else if(/timeout|超时|Waiting failed/i.test(msg)){
        reason='登录或课表接口等待超时，常见于教务系统慢、网络不通、或页面卡在验证环节。';
        actions=['确认电脑后端所在网络能访问教务系统。','检查是否必须连接校园网。','稍后再试，或换热点/校园网测试。'];
      }else if(/JSON|课表接口|kbList|识别/i.test(msg)){
        reason='已经访问到教务系统，但课表接口返回格式不是预期的完整课表数据。';
        actions=['检查学年 xnm 和学期 xqm 是否正确。','确认该账号当前学期确实有课表。','把报错内容反馈给管理员。'];
      }else if(/blocked|ERR_BLOCKED|拦截|net::/i.test(msg)){
        reason='浏览器或网络环境拦截了教务系统页面。';
        actions=['关闭广告拦截/安全拦截类插件。','改用校园网或手机热点测试。','确认 Windows 防火墙允许 Node.js 访问网络。'];
      }
      return {reason,actions,raw:msg};
    }

    function buildSheetMatrix(sheet){
      const ref = sheet['!ref']; if(!ref) return [];
      const range = XLSX.utils.decode_range(ref);
      const rows = Array.from({length: range.e.r - range.s.r + 1}, ()=>Array(range.e.c - range.s.c + 1).fill(''));
      for(let r=range.s.r; r<=range.e.r; r++){
        for(let c=range.s.c; c<=range.e.c; c++){
          const addr = XLSX.utils.encode_cell({r,c});
          const cell = sheet[addr];
          rows[r-range.s.r][c-range.s.c] = cell && cell.v!=null ? String(cell.v) : '';
        }
      }
      (sheet['!merges']||[]).forEach(m=>{
        const top = rows[m.s.r-range.s.r]?.[m.s.c-range.s.c] || '';
        for(let r=m.s.r; r<=m.e.r; r++) for(let c=m.s.c; c<=m.e.c; c++){
          if(!rows[r-range.s.r][c-range.s.c]) rows[r-range.s.r][c-range.s.c] = top;
        }
      });
      return rows.map(r=>r.map(v=>String(v||'').replace(/\u00a0/g,' ').trim()));
    }

    function findSlotColumn(rows, headerIndex){
      const score = new Map();
      for(let c=0;c<Math.max(...rows.map(r=>r.length),0);c++) score.set(c,0);
      rows.slice(headerIndex+1).forEach(r=> r.forEach((v,c)=>{ if(/第?\d+\s*-\s*\d+节?/.test(String(v||''))) score.set(c,(score.get(c)||0)+1); }));

    function splitTeacherLocation(line){

      const parts = txt.split(/\s+/).filter(Boolean);

      const last = parts[parts.length-1];
      if(/[楼场馆室区]|\d{3,}/.test(last)) return {teacher:parts.slice(0,-1).join(' '), location:last};
      return {teacher:parts[0], location:parts.slice(1).join(' ')};

    function parseGridCourseCell(text, day, slot){

      let teacher = '', location = '';
      const nonWeek = lines.slice(1).filter(x=>!/(\d+\s*-\s*\d+周|\d+周)/.test(x));
      if(nonWeek.length>=2){ teacher = nonWeek[0]; location = nonWeek.slice(1).join(' '); }
      else if(nonWeek.length===1){ const pair = splitTeacherLocation(nonWeek[0]); teacher = pair.teacher; location = pair.location; }
      if(!weekText){
        const joined = raw.replace(/\n/g,' ');
        const m = joined.match(/(.+?)[☆★▲※]?\s+([^\s]+(?:\s+[^\s]+)?)\s+(\d+\s*-\s*\d+周(?:\(单\)|\(双\))?|\d+周)\s*$/);

    function parseGridSheet(rows){

          const r=await api('/api/auth/quick-switch',{method:'POST',body:JSON.stringify({username:acc.username,accountId:acc.accountId||'',switchKey:acc.switchKey})});
          state.token=r.token;
          state.switchKey=r.switchKey||acc.switchKey||'';
          localStorage.setItem('courseTableUserToken',state.token);
          if(state.switchKey) localStorage.setItem('xiaodeCurrentSwitchKey',state.switchKey);
          const loaded=await loadMe({expectedAccountId:acc.accountId||r.accountId||''});
          if(!loaded) return;
          closeModal();
          toast('已切换到 '+(state.user?.name||acc.name||acc.username));
          return;
        }
      }catch(e){
        tokenError=e;
      }
      state.token=previousToken;
      state.switchKey=previousSwitchKey;
      state.accountId=previousAccountId;
      if(previousToken) localStorage.setItem('courseTableUserToken',previousToken); else localStorage.removeItem('courseTableUserToken');
      if(previousSwitchKey) localStorage.setItem('xiaodeCurrentSwitchKey',previousSwitchKey); else localStorage.removeItem('xiaodeCurrentSwitchKey');
      if(previousAccountId) localStorage.setItem('xiaodeCurrentAccountId',previousAccountId); else localStorage.removeItem('xiaodeCurrentAccountId');
      if(btn){ btn.disabled=false; btn.textContent=originalText; }
      if(tokenError && /请先登录|过期|401|登录状态/i.test(String(tokenError.message||tokenError))){
        toast('这个账号需要重新验证一次');
        return openAccountReloginModal(acc);
      }
      toast(tokenError?.message||'切换失败');
      return;
      }finally{
        endAccountTransition(transitionVersion);
      }
    }

    function downloadTextFile(content, filename, mime='text/plain;charset=utf-8'){
      const blob=new Blob([content],{type:mime});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    function downloadJson(data, filename){ downloadTextFile(JSON.stringify(data,null,2), filename, 'application/json;charset=utf-8'); }
    async function shareOrDownloadText(content, filename, mime='application/json;charset=utf-8', title='小德课表'){
      if(window.XiaoDeAndroid && typeof window.XiaoDeAndroid.shareTextFile==='function'){
        window.XiaoDeAndroid.shareTextFile(filename, content, mime); return 'shared';
      }
      try{
        const file=new File([content], filename, {type:mime});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({title, text:'来自小德课表的课表文件', files:[file]}); return 'shared';
        }
      }catch(e){ console.warn(e); }
      downloadTextFile(content, filename, mime); return 'downloaded';
    }

    function icsEscape(text=''){ return String(text||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
    function icsDate(date, time){ const d=new Date(date); const [h,m]=String(time||'00:00').split(':').map(Number); d.setHours(h||0,m||0,0,0); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`; }
    function buildCalendarIcs(scope='week'){
      const weeks=scope==='all'?Array.from({length:totalWeeks()},(_,i)=>i+1):[getSelectedWeek()];
      const settings=loadReminderSettings();
      const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//XiaoDe Course Table//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
      weeks.forEach(w=>{
        coursesForWeek(w).forEach(c=>{
          const dayDate=weekDateObject(c.day,w);
          if(!dayDate) return;
          const slot=getSlot(c.slot);
          lines.push('BEGIN:VEVENT');
          lines.push(`UID:${icsEscape(c.id||Math.random())}-${w}@xiaode-course-table`);
          lines.push(`DTSTAMP:${icsDate(new Date(),'00:00')}`);
          lines.push(`DTSTART:${icsDate(dayDate,slot.start)}`);
          lines.push(`DTEND:${icsDate(dayDate,slot.end)}`);
          lines.push(`SUMMARY:${icsEscape(c.shortName||c.name||'课程')}`);
          if(c.location) lines.push(`LOCATION:${icsEscape(c.location)}`);
          const desc=[c.name&&`课程：${c.name}`,c.shortName&&`简称：${c.shortName}`,c.teacher&&`老师：${c.teacher}`,c.classGroup&&`班级：${c.classGroup}`,c.weekText&&`周次：${c.weekText}`].filter(Boolean).join('\n');
          if(desc) lines.push(`DESCRIPTION:${icsEscape(desc)}`);
          if(settings.startEnabled) lines.push('BEGIN:VALARM',`TRIGGER:-PT${Number(settings.startOffset||10)}M`,'ACTION:DISPLAY',`DESCRIPTION:${icsEscape(c.shortName||c.name||'课程提醒')}`,'END:VALARM');
          lines.push('END:VEVENT');
        });
      });
      lines.push('END:VCALENDAR');
      return lines.join('\r\n');
    }
    async function exportCalendar(scope='week'){
      try{
        const ics=buildCalendarIcs(scope);
        const filename=`小德课表日历_${scope==='all'?'全学期':'第'+getSelectedWeek()+'周'}_${backupDateStamp()}.ics`;
        const mode=await shareOrDownloadText(ics, filename, 'text/calendar;charset=utf-8', '小德课表日历');
        toast(mode==='shared'?'已调起系统分享/日历导入':'已导出日历文件');
      }catch(e){ toast(e.message||'日历导出失败'); }
    }
    const DEFAULT_REMINDER_SETTINGS={startEnabled:true,startOffset:10,endEnabled:true,endOffset:0,calendarId:'',calendarName:''};
    function loadReminderSettings(){
      try{const scoped=localStorage.getItem(accountStorageKey('xiaodeReminderSettings',state.accountId));const legacy=localStorage.getItem('xiaodeReminderSettings');return {...DEFAULT_REMINDER_SETTINGS,...JSON.parse(scoped||legacy||'{}')}}catch(_){return {...DEFAULT_REMINDER_SETTINGS}}
    }
    function saveReminderSettings(next){
      const merged={...loadReminderSettings(),...(next||{})};
      merged.startOffset=Number(merged.startOffset||0); merged.endOffset=Number(merged.endOffset||0);
      localStorage.setItem(accountStorageKey('xiaodeReminderSettings',state.accountId), JSON.stringify(merged));

    function hasAndroidCalendarBridge(){
      return !!(window.XiaoDeAndroid && typeof window.XiaoDeAndroid.hasCalendarPermission==='function' && typeof window.XiaoDeAndroid.requestCalendarPermission==='function' && typeof window.XiaoDeAndroid.listCalendars==='function' && typeof window.XiaoDeAndroid.syncCourseReminders==='function');
    }
    function androidCalendarGranted(){
      try{return !!(hasAndroidCalendarBridge() && window.XiaoDeAndroid.hasCalendarPermission())}catch(_){return false}
    }
    function readAndroidCalendars(){
      if(!hasAndroidCalendarBridge()) return {ok:false,calendars:[],message:'当前不是 Android App 环境'};
      try{
        const raw=window.XiaoDeAndroid.listCalendars();

    function pad2(n){return String(n).padStart(2,'0')}
    function dateTimeMs(date,time){ const d=new Date(date); const [h,m]=String(time||'00:00').split(':').map(Number); d.setHours(h||0,m||0,0,0); return d.getTime(); }
    function formatDateTime(ms){ const d=new Date(Number(ms)); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:00`; }
    function formatTime(ms){ const d=new Date(Number(ms)); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
    function buildReminderEvents(settings=loadReminderSettings()){
      const events=[];
      const markerBase=(state.accountId||'unknown').replace(/[^\w-]/g,'_');
      for(let w=1;w<=totalWeeks();w++){
        coursesForWeek(w).forEach(c=>{
          const dayDate=weekDateObject(c.day,w); if(!dayDate) return;
          const slot=getSlot(c.slot);
          const startMs=dateTimeMs(dayDate,slot.start), endMs=dateTimeMs(dayDate,slot.end);
          if(!Number.isFinite(startMs)||!Number.isFinite(endMs)||endMs<=startMs) return;
          const titleBase=c.shortName||c.name||'课程';
          const location=c.location||'';
          const common=[`课程：${c.name||titleBase}`,c.teacher&&`老师：${c.teacher}`,location&&`地点：${location}`,`周次：第 ${w} 周`,`${DAYS[Number(c.day||1)-1]||''} · ${slot.label||c.slot}`].filter(Boolean).join('\n');
          if(settings.startEnabled){
            const off=Number(settings.startOffset||0);
            const remindMs=startMs-off*60000;
            events.push({
              type:'start',title:`${titleBase} 上课提醒`,courseName:titleBase,location,week:w,day:Number(c.day||1),slot:Number(c.slot||1),
              startMs,endMs,remindMs,alarmMinutes:Math.max(0,off),fingerprint:`${markerBase}-${c.id||titleBase}-${w}-start`,
              description:`${common}\n${off>0?`${off} 分钟后上课`:'现在上课'}\nXIAODE_ACCOUNT::${state.accountId}\nXIAODE_REMINDER::${markerBase}-${c.id||titleBase}-${w}-start`
            });
          }
          if(settings.endEnabled){
            const off=Number(settings.endOffset||0);
            const remindMs=endMs-off*60000;
            events.push({
              type:'end',title:`${titleBase} 下课提醒`,courseName:titleBase,location,week:w,day:Number(c.day||1),slot:Number(c.slot||1),
              startMs:remindMs,endMs:remindMs+5*60000,remindMs,alarmMinutes:0,fingerprint:`${markerBase}-${c.id||titleBase}-${w}-end`,
              description:`${common}\n${off>0?`${off} 分钟后下课`:'现在下课'}\nXIAODE_ACCOUNT::${state.accountId}\nXIAODE_REMINDER::${markerBase}-${c.id||titleBase}-${w}-end`
            });
          }
        });
      }
      return events.sort((a,b)=>a.remindMs-b.remindMs);
    }
    function renderReminderPreview(settings=loadReminderSettings()){
      const now=Date.now();
      const events=buildReminderEvents(settings).filter(e=>e.remindMs>=now-10*60000).slice(0,6);
      if(!events.length) return '<div class="detail">当前设置下没有可预览的提醒。请检查开学日期、周次和课程时间。</div>';
      return `<div class="reminder-preview">${events.map(e=>{
        const off=e.type==='start'?Number(settings.startOffset||0):Number(settings.endOffset||0);
        const action=e.type==='start'?'上课':'下课';
        const line=off>0?`${off}分钟后${action}:${e.slot}（${formatTime(e.type==='start'?e.startMs:(e.remindMs+off*60000))}）`:`现在${action}:${e.slot}`;
        return `<div class="reminder-preview-item ${e.type==='end'?'end':''}"><div>${formatDateTime(e.remindMs)}${action}提醒</div><div>${escapeHtml(line)}</div></div>`;
      }).join('')}</div>`;
    }

    async function doImport(replace){ try{ let rows=[]; const text=$('#importText').value.trim(); if(text) rows=parseCsv(text); else if(window._importRows) rows=window._importRows; const courses=normalizeImported(rows); if(!courses.length) return toast('没有可导入的课程'); await api('/api/my/import',{method:'POST',body:JSON.stringify({courses,replace})}); await loadMe(); toast(`已${replace?'覆盖':'追加'}导入 ${courses.length} 条到你的课表，并已刷新显示`); }catch(e){ toast(e.message); } }

    let jwxtReplaceMode = true;
    let latestAndroidImportCode = '';
    function hasAndroidBridge(){

    }
    function startAndroidNativeImport(payload){
      if(!hasAndroidBridge()) return false;
      try{
        window.XiaoDeAndroid.startImport(JSON.stringify(payload));

        console.warn('Android bridge startImport failed', e);

    function refreshAndroidBridgeUi(){
      const inApp = hasAndroidBridge() || window.__XIAODE_ANDROID_APP__;
      const createBtn = $('#createImportCodeBtn');
      const guideBtn = $('#androidImportGuideBtn');
      if(createBtn) createBtn.textContent = inApp ? '开始 App 内教务导入' : '生成一次性导入码';

    function syncAndroidImportUi(){
      const input=$('#appServerUrl');
      if(input) {
        input.value=location.origin;
        input.onclick=()=>selectInputText(input);
        input.onfocus=()=>selectInputText(input);
      }
      const modeBtn=$('#jwxtAppendModeBtn');
      if(modeBtn) modeBtn.textContent=jwxtReplaceMode?'当前：覆盖导入':'当前：追加导入';
      refreshAndroidBridgeUi();
    }
    function selectInputText(input){
      if(!input) return;
      input.focus();
      input.select();
      if(input.setSelectionRange) input.setSelectionRange(0, input.value.length);
    }
    function fallbackCopy(value, inputSelector){
      const input = inputSelector ? $(inputSelector) : null;
      if(input){
        input.value = value;
        selectInputText(input);
        try{ if(document.execCommand('copy')) return true; }catch{}
        return false;
      }
      const temp=document.createElement('input');
      temp.value=value;
      temp.style.position='fixed';
      temp.style.left='-9999px';
      document.body.appendChild(temp);
      selectInputText(temp);
      let ok=false;
      try{ ok=document.execCommand('copy'); }catch{}
      document.body.removeChild(temp);
      return ok;
    }
    async function copyText(value, successText, inputSelector){
      if(!value) return toast('没有可复制的内容');
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(value);
          toast(successText);
          return;
        }
      }catch{}
      if(fallbackCopy(value, inputSelector)){
        toast(successText);
      }else{
        const input = inputSelector ? $(inputSelector) : null;
        if(input) selectInputText(input);
        toast('已选中内容；如果没有自动复制，请长按/复制选中内容');
      }
    }
    async function copyServerUrl(){
      const value=location.origin;
      await copyText(value, '服务器地址已复制，可以粘贴到 Android 导入助手', '#appServerUrl');
    }
    async function createAndroidImportCode(){
      try{
        const xnm=$('#jwxtXnm')?.value.trim()||'2025';
        const xqm=$('#jwxtXqm')?.value.trim()||'12';
        const r=await api('/api/my/import-code',{method:'POST',body:JSON.stringify({replace:jwxtReplaceMode,xnm,xqm})});
        latestAndroidImportCode=r.code;
        $('#androidImportCodeBox')?.classList.remove('hidden');
        const codeInput=$('#androidImportCode');
        const metaInput=$('#androidImportCodeMeta');
        if(codeInput) {
          codeInput.value=r.code;
          codeInput.onclick=()=>selectInputText(codeInput);
          codeInput.onfocus=()=>selectInputText(codeInput);
          setTimeout(()=>selectInputText(codeInput), 80);
        }
        const codeBig=$('#androidImportCodeBig');
        if(codeBig){
          codeBig.textContent=r.code;
          codeBig.onclick=()=>copyImportCode();
        }
        if(metaInput){
          const expire = r.expiresAt ? new Date(r.expiresAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '10 分钟内';
          metaInput.value=`${expire} 前有效；${r.replace?'覆盖导入':'追加导入'}；xnm=${r.xnm}，xqm=${r.xqm}`;
        }
        const payload={
          code:r.code,
          accountId:r.accountId||state.accountId,
          xnm:r.xnm || xnm,
          xqm:r.xqm || xqm,
          replace:!!r.replace,
          expiresAt:r.expiresAt || '',
          serverUrl:location.origin
        };
        if(startAndroidNativeImport(payload)){
          const box=$('#androidImportCodeBox');
          if(box) box.classList.add('hidden');
          toast('导入码已生成，正在进入 App 内教务系统导入页…');
          return;
        }
        toast(`导入码已生成：${r.code}。已自动选中，可直接复制或长按复制。`);
      }catch(e){
        toast(e.message||'导入码生成失败');
      }
    }
    async function copyImportCode(){
      const value=latestAndroidImportCode || $('#androidImportCode')?.value || '';
      if(!value) return toast('请先生成导入码');
      await copyText(value, '导入码已复制，可以粘贴到 Android 导入助手', '#androidImportCode');
    }
    function openAndroidImportGuide(){
      const xnm=$('#jwxtXnm')?.value.trim()||'2025';
      const xqm=$('#jwxtXqm')?.value.trim()||'12';
      openModal('Android 教务导入流程', `
        <div class="detail" style="margin-bottom:12px">
          <div style="font-weight:900;font-size:18px;margin-bottom:6px">核心原则</div>
          <div>不保存教务系统密码；不自动代输账号密码；不让同学复制控制台脚本。</div>
          <div>App 内置 WebView 打开教务系统，同学自己登录，App 只读取登录后的 Cookie 请求课表 JSON。</div>
        </div>
        <div class="detail" style="margin-bottom:12px">
          <div style="font-weight:900;font-size:18px;margin-bottom:6px">当前配置</div>
          <div>服务器地址：<b>${escapeHtml(location.origin)}</b></div>
          <div>学年 xnm：<b>${escapeHtml(xnm)}</b>；学期 xqm：<b>${escapeHtml(xqm)}</b></div>
          <div>导入模式：<b>${jwxtReplaceMode?'覆盖原课表':'追加到原课表'}</b></div>
        </div>
        <div class="detail">
          <div style="font-weight:900;font-size:18px;margin-bottom:6px">推荐接口</div>
          <div>网页版生成导入码：<code>POST /api/my/import-code</code></div>
          <div>App 校验导入码：<code>GET /api/import-code/:code</code></div>
          <div>App 提交教务 JSON：<code>POST /api/import-code/:code/submit</code></div>
          <div class="sub">开发测试仍可使用账号 token：<code>POST /api/my/import/jwxt-json</code></div>
        </div>
      `);
    }
    $('#copyServerUrlBtn') && ($('#copyServerUrlBtn').onclick=copyServerUrl);
    $('#createImportCodeBtn') && ($('#createImportCodeBtn').onclick=createAndroidImportCode);
    $('#copyImportCodeBtn') && ($('#copyImportCodeBtn').onclick=copyImportCode);
    $('#androidImportGuideBtn') && ($('#androidImportGuideBtn').onclick=openAndroidImportGuide);
    $('#jwxtAppendModeBtn') && ($('#jwxtAppendModeBtn').onclick=()=>{ jwxtReplaceMode=!jwxtReplaceMode; syncAndroidImportUi(); toast(jwxtReplaceMode?'导入模式：覆盖原课表':'导入模式：追加到原课表'); });
    syncAndroidImportUi();

    $('#fileInput').onchange=async(e)=>{ try{ const file=e.target.files[0]; if(!file) return; const lower=file.name.toLowerCase(); if(lower.endsWith('.csv')){ window._importRows=parseCsv(await file.text()); const n=normalizeImported(window._importRows).length; toast(`CSV 已读取，匹配到 ${n} 条课程`); return; } if(lower.endsWith('.pdf')){ window._importRows=await parsePdfFile(file); toast(`PDF 已读取，匹配到 ${window._importRows.length} 条课程`); return; } const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array'}); let bestRows=[]; let bestCount=0; let bestName=''; for(const name of wb.SheetNames){ const sheet=wb.Sheets[name]; const matrix = buildSheetMatrix(sheet); const gridCandidate = detectGridSheet(matrix) ? parseGridSheet(matrix) : []; const recordCandidate = XLSX.utils.sheet_to_json(sheet,{defval:''}); const gridCount = normalizeImported(gridCandidate).length; const recordCount = normalizeImported(recordCandidate).length; const candidate = gridCount >= recordCount ? gridCandidate : recordCandidate; const count = Math.max(gridCount, recordCount); if(count>bestCount){ bestCount=count; bestRows=candidate; bestName=name; } } window._importRows=bestRows; if(!bestCount) throw new Error('没有读取到有效内容：这份 Excel 不是普通导入表。我已按网格课表尝试解析，但还没匹配到课程。'); toast(`Excel 已读取（${bestName}），匹配到 ${bestCount} 条课程，可点击覆盖或追加导入`); }catch(err){ console.error(err); toast(err.message||'文件读取失败'); } };
    $('#saveProfileBtn') && ($('#saveProfileBtn').onclick=async()=>{ try{ const r=await api('/api/my/profile',{method:'PUT',body:JSON.stringify({name:$('#profileName').value.trim(), username:state.user?.username||''})}); state.user=r.user; renderAll(); toast('姓名已保存'); }catch(e){ toast(e.message); } });
    $('#changePasswordBtn') && ($('#changePasswordBtn').onclick=async()=>{ try{ await api('/api/auth/password',{method:'PUT',body:JSON.stringify({oldPassword:$('#oldPassword').value,newPassword:$('#newPassword').value})}); $('#oldPassword').value=''; $('#newPassword').value=''; toast('密码已修改'); }catch(e){ toast(e.message); } });
    $('#closeModal').onclick=closeModal; $('#backdrop').onclick=closeModal;




    // Android 桌面小组件同步：网页负责把当前课表数据交给 App，App 保存到本地并刷新小组件。
    // 小组件不直接读取 WebView 页面；它只读取 Android 本地缓存，所以每次 loadMe / 导入成功后都同步一次。
    function hasWidgetBridge(){
      return !!(window.XiaoDeAndroid && typeof window.XiaoDeAndroid.syncWidgetData === 'function');
    }
    function buildWidgetPayload(){
      const now = new Date();
      const current = state.user ? nowCourse(now) : null;
      const next = state.user ? nextCourse(now) : null;
      return {
        version: 2,
        accountId: state.accountId,
        reason: 'web-sync',
        syncedAt: new Date().toISOString(),
        scheduleName: state.user ? (state.user.name || state.user.username || '我的课表') : '我的课表',
        user: state.user ? { name: state.user.name || '', username: state.user.username || '' } : null,
        meta: state.meta ? {
          campusName: state.meta.campusName || '',
          termStart: state.meta.termStart || '',
          totalWeeks: Number(state.meta.totalWeeks || 17),
          currentWeek: getWeek(now)
        } : {},
        slots: (state.slots || []).map(s => ({
          slot: Number(s.slot),
          label: s.label || '',
          range: s.range || '',
          start: s.start || '',
          end: s.end || ''
        })),
        courses: (state.courses || []).map(c => ({
          id: c.id || '',
          name: c.name || '',
          teacher: c.teacher || '',
          location: c.location || '',
          day: Number(c.day || 1),
          slot: Number(c.slot || 1),
          weeks: Array.isArray(c.weeks) ? c.weeks : [],
          weekText: c.weekText || '',
          oddEven: c.oddEven || 'all',
          category: c.category || 'custom'
        })),
        currentCourse: current ? { name: current.name || '', location: current.location || '', day: current.day, slot: current.slot } : null,
        nextCourse: next ? { name: next.name || '', location: next.location || '', day: next.day, slot: next.slot } : null
      };
    }
    function syncWidgetNow(reason='manual'){
      if(!hasWidgetBridge() || !state.user || !state.meta) return false;
      try{
        const payload = buildWidgetPayload();
        payload.reason = reason;
        window.XiaoDeAndroid.syncWidgetData(JSON.stringify(payload));
        return true;
      }catch(e){
        console.warn('小组件同步失败', e);
        return false;
      }
    }
    window.__xiaodeSyncWidgetNow = syncWidgetNow;
    window.addEventListener('xiaode-android-ready', () => setTimeout(()=>syncWidgetNow('android-ready'), 250));

    // App 原生导入页完成后会主动触发这个事件。
    // 这样不依赖用户切换焦点，导入成功后课表页会立刻拉取最新数据。
    window.addEventListener('xiaode-import-success', async (ev) => {
      try{
        const d = ev.detail || window.__xiaodeLastImportSummary || {};
        const summary=d.summary||{};
        const summaryText=`收到 ${summary.received??d.rawCount??0} 条，识别 ${summary.recognized??d.convertedCount??0} 条，写入 ${summary.written??d.savedCount??d.count??0} 条，合并 ${summary.merged??0} 条，过滤 ${summary.filtered??0} 条。`;
        if(d.accountId && d.accountId!==state.accountId){
          localStorage.setItem(accountStorageKey('xiaodePendingImportRefresh',d.accountId),JSON.stringify({traceId:d.traceId||'',summary,completedAt:new Date().toISOString()}));
          toast('另一账号导入完成，切回后会自动刷新');
          return;
        }
        const accountAtStart=state.accountId;
        await loadMe({expectedAccountId:accountAtStart});
        syncWidgetNow('import-success');
        toast(`教务导入成功：${summaryText}`);
      }catch(e){
        console.warn('Android 导入成功后刷新失败：', e);
        toast('导入成功，但课表自动刷新失败，请手动刷新');
      }
    });

    // Android 导入助手完成后，用户回到网页版时自动刷新当前账号课表。
    // 不用 setInterval 常驻轮询，避免多用户时给后端制造无意义请求。
    let lastAutoRefreshAt = 0;
    async function autoRefreshAfterAndroidImport(reason='auto'){
      if(!state.token || !state.user) return;
      const now = Date.now();
      if(now - lastAutoRefreshAt < 3000) return;
      lastAutoRefreshAt = now;
      try{
        const accountAtStart=state.accountId;
        await loadMe({expectedAccountId:accountAtStart});
        console.log('课表已自动刷新：', reason);
      }catch(e){
        console.warn('自动刷新失败：', e);
      }
    }
    window.addEventListener('focus', () => autoRefreshAfterAndroidImport('window-focus'));
    document.addEventListener('visibilitychange', () => {
      if(!document.hidden) autoRefreshAfterAndroidImport('visibilitychange');
    });

    applyTheme(state.theme);
    updateBottomToolbar(false);
    updateToolbarToggleTile();
    (async function init(){ try{ await bootPublic(); if(state.token){ try{ await loadMe(); }catch{ state.token=''; localStorage.removeItem('courseTableUserToken'); resetToLoggedOut(); } } else { renderAuthState(false); } setInterval(()=>state.meta&&renderHeader(),1000); }catch(e){ console.error(e); toast('后端未启动，请先运行 backend 服务'); } })();
  </script>
